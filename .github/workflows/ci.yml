name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Records the portfolio's runtime on every run: per-step cost and the
      # wall-clock to a shared fit target, so A1-A4 stay comparable as they land.
      # A percentage regression gate needs a controlled baseline machine, which is
      # M6's benchmark work; until then the number is in the log rather than
      # enforced.
      - name: Solver benchmark
        run: cargo bench -p umbra-recon --bench portfolio

      - name: Build wasm core
        run: cargo build -p umbra-wasm --target wasm32-unknown-unknown --release

  licensing:
    name: Licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Manifests and fixture provenance
        run: bash tools/check-licensing.sh

  assets:
    name: Asset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Versioned asset manifests
        run: bash tools/check-assets.sh

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build
