[package]
name = "umbra-recon"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Reconstruction solvers A1-A5 for UMBRA"

[dependencies]
umbra-core.workspace = true
umbra-forward.workspace = true
umbra-physics.workspace = true

# The benchmark is a plain binary on purpose: `criterion` pulls in `windows-sys`
# with raw-dylib imports, which will not link on the windows-gnu host without
# `dlltool`. See the header of benches/portfolio.rs, which also explains the
# metric every solver is measured by.
[[bench]]
name = "portfolio"
harness = false
